[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/server", "crates/desktop"]
# The desktop shell needs the platform webview libraries (see README), so it is built on request:
#   cargo build -p rspostman-desktop
default-members = ["crates/core", "crates/cli", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yfyang86/rsPostman"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
strip = true
