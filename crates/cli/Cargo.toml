[package]
name = "rspostman"
description = "rsPostman: a local-first Postman-compatible API client (CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rspostman"
path = "src/main.rs"

[dependencies]
rspostman-core = { path = "../core" }
rspostman-server = { path = "../server" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
chrono = "0.4"
url = "2"
