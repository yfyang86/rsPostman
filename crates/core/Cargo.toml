[package]
name = "rspostman-core"
description = "Core engine of rsPostman: Postman-compatible collections, HTTP execution, auth, variables"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "gzip", "brotli", "deflate", "socks", "http2"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
url = "2"
percent-encoding = "2"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
tiny_http = "0.12"
