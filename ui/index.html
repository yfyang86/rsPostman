<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rsPostman</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="22" height="22"><span>rsPostman</span></div>
    <nav id="toolbar"></nav>
    <div class="spacer"></div>
    <div id="envbar"></div>
  </header>
  <div id="layout">
    <aside id="sidebar">
      <div id="side-tabs" role="tablist"></div>
      <div id="side-body"></div>
    </aside>
    <div id="resizer" title="Drag to resize"></div>
    <main id="main">
      <div id="tabbar"></div>
      <div id="workspace"></div>
    </main>
  </div>
  <footer id="statusbar"></footer>
</div>
<div id="overlay-root"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
